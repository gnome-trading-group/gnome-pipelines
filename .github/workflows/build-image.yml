name: Build & Push Pipelines Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'gnome_pipelines/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
  workflow_dispatch:

jobs:
  # One image per pipeline family (gnome_pipelines/families/<family>.py), each with only its own extra installed.
  families:
    runs-on: ubuntu-latest
    outputs:
      families: ${{ steps.list.outputs.families }}
      sha: ${{ steps.list.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List the families
        id: list
        run: |
          FAMILIES=$(ls gnome_pipelines/families | sed -n 's/^\([a-z0-9_]*\)\.py$/\1/p' | grep -v '^__init__$' | jq -R . | jq -cs .)
          echo "families=$FAMILIES" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  dev:
    needs: families
    runs-on: ubuntu-latest
    strategy:
      # Families deploy independently: one failing to build doesn't hold the others back.
      fail-fast: false
      matrix:
        family: ${{ fromJson(needs.families.outputs.families) }}
    permissions:
      id-token: write
      contents: read
    env:
      SHA: ${{ needs.families.outputs.sha }}
      FAMILY: ${{ matrix.family }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build fails if the family's pipelines don't import with only its extra installed.
      - name: Build image
        run: |
          docker build \
            --build-arg FAMILY=$FAMILY \
            --build-arg GIT_SHA=$SHA \
            -t gnome-pipelines:$FAMILY-latest \
            -t gnome-pipelines:$FAMILY-$SHA \
            .

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - name: Login to ECR (dev)
        id: login-ecr-dev
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to dev ECR
        run: |
          REGISTRY=${{ steps.login-ecr-dev.outputs.registry }}
          docker tag gnome-pipelines:$FAMILY-latest $REGISTRY/gnome-pipelines:$FAMILY-latest
          docker tag gnome-pipelines:$FAMILY-$SHA $REGISTRY/gnome-pipelines:$FAMILY-$SHA
          docker push $REGISTRY/gnome-pipelines:$FAMILY-latest
          docker push $REGISTRY/gnome-pipelines:$FAMILY-$SHA

      # From the image just pushed, so the API and the schedules describe the code that will run. It replaces
      # only this family's manifest entries.
      - name: Publish the family's pipeline manifest (dev)
        run: |
          docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION \
            --entrypoint python gnome-pipelines:$FAMILY-$SHA -m gnome_pipelines.manifest publish

  # Waits for a reviewer on the `prod` environment (repo Settings → Environments), so a push to
  # main reaches prod's scheduled runs only once someone has seen it work in dev. It promotes the
  # exact images dev got rather than rebuilding them.
  prod:
    needs: [families, dev]
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJson(needs.families.outputs.families) }}
    permissions:
      id-token: write
      contents: read
    env:
      SHA: ${{ needs.families.outputs.sha }}
      FAMILY: ${{ matrix.family }}

    steps:
      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - name: Login to ECR (dev)
        id: login-ecr-dev
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull the dev image
        run: docker pull ${{ steps.login-ecr-dev.outputs.registry }}/gnome-pipelines:$FAMILY-$SHA

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Login to ECR (prod)
        id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to prod ECR
        run: |
          SOURCE=${{ steps.login-ecr-dev.outputs.registry }}/gnome-pipelines:$FAMILY-$SHA
          REGISTRY=${{ steps.login-ecr-prod.outputs.registry }}
          docker tag $SOURCE $REGISTRY/gnome-pipelines:$FAMILY-$SHA
          docker tag $SOURCE $REGISTRY/gnome-pipelines:$FAMILY-latest
          docker push $REGISTRY/gnome-pipelines:$FAMILY-$SHA
          docker push $REGISTRY/gnome-pipelines:$FAMILY-latest

      - name: Publish the family's pipeline manifest (prod)
        run: |
          docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION \
            --entrypoint python ${{ steps.login-ecr-dev.outputs.registry }}/gnome-pipelines:$FAMILY-$SHA \
            -m gnome_pipelines.manifest publish
