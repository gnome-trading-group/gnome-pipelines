[tool.poetry]
name = "gnome-pipelines"
version = "0.1.0"
description = "Data pipelines, ingestion and their infrastructure for gnome research datasets"
authors = ["mprey <masonprey7@gmail.com>"]
readme = "README.md"

[tool.poetry.scripts]
gnome-pipelines = "gnome_pipelines.cli:main"

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
gnomepy = {version = "^2.26.1", extras = ["live-data"]}
gnomepy-research = {git = "https://github.com/gnome-trading-group/gnomepy-research.git", tag = "v1.0.0"}
beautifulsoup4 = "*"
lxml = "^6.0"
zenrows = "^1.4.1"
nodriver = "*"
demoparser2 = "*"
opencv-python = "*"
pydantic = "^2.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
sqlalchemy = "^2.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
